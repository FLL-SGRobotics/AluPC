name: Tests, Builds und Release

permissions:
  contents: write

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketquellen – bei Netzfehlern wiederholen statt hängen
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nDPkg::Lock::Timeout "120";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-alupc-ci
          # Störung 11.11.2026 (actions/runner-images#15297): die Ubuntu-Spiegel ließen sich auf den GitHub-Rechnern
          # nicht auflösen. Dann auf den Spiegel von kernel.org ausweichen.
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if ! getent hosts "$host" >/dev/null; then
              echo "::warning title=Paketquellen::$host nicht erreichbar – weiche auf mirrors.edge.kernel.org aus"
              for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
                [ -f "$f" ] && sudo sed -i -E 's#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' "$f"
              done
              break
            fi
          done
      - name: Systembibliotheken für Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libpulse0 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libfontconfig1 libdbus-1-3 libxkbfile1
      - name: Installieren
        run: pip install -e ".[test]" av pytest-timeout
      - name: Tests
        run: |
          set -o pipefail
          timeout -k 30 1200 python -X faulthandler -m pytest -v --timeout=240 --timeout-method=thread 2>&1 | tee tests.log || {
            # Fehler und Absturz-Stapel als Hinweise (ohne Anmeldung lesbar). GitHub zeigt nur 10 Hinweise je Art –
            # darum zuerst je EIN Hinweis mit dem ganzen Stapel des abgestürzten Threads und dem letzten Test.
            crash=$(grep -A30 "^Current thread" tests.log | head -32 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$crash" ] && echo "::error title=Absturzstelle::$crash"
            last=$(grep -E "::test_" tests.log | tail -3 | awk '{printf "%s%%0A", $0}')
            [ -n "$last" ] && echo "::error title=Zuletzt::$last"
            grep -E "^(FAILED|E   |ERROR)|Timeout" tests.log | head -8 | sed 's/^/::error::/'
            exit 1; }
      - name: Ton echt – PulseAudio mit 2 Lautsprechern und 2 Mikrofonen (Gerät wählen, Pegel, stumm)
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils > /dev/null || { sudo apt-get update; sudo apt-get install -y pulseaudio pulseaudio-utils > /dev/null; }
          python tests/audio_linux_check.py 2>&1 | tee audio.log
          test "${PIPESTATUS[0]}" -eq 0 || { grep "✗" audio.log | sed 's/^/::error title=Ton (Linux)::/'; exit 1; }
          echo "::notice title=Ton (Linux)::$(tail -1 audio.log)"
      - name: Mischpult echt – virtuelle Geräte anlegen, Ton weiterleiten (kommt im virtuellen Mikro an), Pegel
        run: |
          pulseaudio --check 2>/dev/null || pulseaudio --start --exit-idle-time=-1 2>/dev/null || true
          sleep 1
          python -m pytest -q -rs tests/test_audio_mixer.py -k real 2>&1 | tee mixer.log
          grep -q "1 passed" mixer.log || { tail -20 mixer.log | sed 's/^/::error title=Mischpult (Linux)::/'; exit 1; }
          echo "::notice title=Mischpult (Linux)::virtuelles Mikro, Weiterleitung, Lautstärke, Pegel – echt mit PulseAudio"
      - name: AluPC-WLAN echt – virtuelles Handy im eigenen Netz (QR-Codes, Mitspielen, Abstimmen, Steuern)
        run: |
          sudo apt-get install -y iproute2 > /dev/null
          sudo -E "$(which python)" tests/wlan_linux_check.py 2>&1 | tee wlan.log
          test "${PIPESTATUS[0]}" -eq 0 || { grep "✗" wlan.log | sed 's/^/::error title=AluPC-WLAN::/'; exit 1; }
          echo "::notice title=AluPC-WLAN (Linux)::$(tail -1 wlan.log)"
      - name: Systemweite Tastenkürzel echt – KDE-Dienst kglobalaccel, Tasten per xdotool (AluPC im Hintergrund)
        run: |
          sudo apt-get install -y libkf5globalaccel-bin xdotool xvfb x11-xkb-utils > /dev/null
          dbus-run-session -- bash -c 'Xvfb :56 -screen 0 1024x768x24 >/dev/null 2>&1 & X=$!; sleep 1; \
            export DISPLAY=:56; setxkbmap us; kglobalaccel5 >/dev/null 2>&1 & K=$!; \
            python tests/kde_hotkeys_check.py; c=$?; kill $X $K; exit $c' 2>&1 | tee kde.log
          test "${PIPESTATUS[0]}" -eq 0 || { grep "✗" kde.log | sed 's/^/::error title=Tastenkürzel (KDE)::/'; exit 1; }
          echo "::notice title=Tastenkürzel (KDE)::$(tail -1 kde.log)"
      - name: Jede Einstellung echt bedienen – gespeichert, zurückstellbar, wirkt
        run: |
          python tests/settings_check.py > settings.log 2>&1 || {
            grep -E "✗|Traceback" settings.log | head -30 | sed 's/^/::error title=Einstellungen::/'; exit 1; }
          echo "::notice title=Einstellungen (Linux)::$(tail -1 settings.log)"
      - name: Rundgang – jede Seite, jedes Fenster, jede Monitor-2-Anzeige öffnen (Fehler = rot)
        run: |
          python tools/screens_tour.py "$RUNNER_TEMP/rundgang" hell > tour.log 2>&1 || {
            grep -E "FEHLER|✗|Traceback|Error" tour.log | head -30 | sed 's/^/::error title=Rundgang::/'; exit 1; }
          echo "::notice title=Rundgang::$(tail -1 tour.log)"
      - name: Rundgang-Bilder für den Vergleich mit Windows aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rundgang-linux
          path: ${{ runner.temp }}/rundgang
          retention-days: 7
      - name: Sprache echt – Piper spricht (auch über ein virtuelles Mikrofon), Vosk/Whisper hören, AluPC versteht
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils || { sudo apt-get update; sudo apt-get install -y pulseaudio pulseaudio-utils; }
          pulseaudio --check 2>/dev/null || pulseaudio -D --exit-idle-time=-1  # läuft schon vom Mischpult-Schritt
          sleep 1
          pactl load-module module-null-sink sink_name=virt
          pactl load-module module-virtual-source source_name=virtmic master=virt.monitor
          pactl set-default-source virtmic
          export ALUPC_PULSE=1 QT_QPA_PLATFORM=offscreen
          python tests/voice_real_check.py || python tests/voice_real_check.py

  ui-vergleich:
    # Gleiche Oberfläche auf Linux und Windows? Rundgang auch unter Windows, dann Seite für Seite vergleichen
    # (Bild + sichtbare Texte). Nur Hinweise – hält die Veröffentlichung nicht auf.
    needs: test-linux
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installieren
        run: pip install -e ".[test]" pillow
      - name: Rundgang unter Windows
        shell: bash
        run: |
          code=0; python -X faulthandler tools/screens_tour.py "$RUNNER_TEMP/rundgang-win" hell > tour.log 2>&1 || code=$?
          echo "::notice title=Rundgang Windows::Exit $code · $(wc -l < tour.log) Zeilen · $(ls "$RUNNER_TEMP/rundgang-win" 2>/dev/null | wc -l) Dateien · $(tail -1 tour.log | tr -d '\r')"
          grep -E "FEHLER|Traceback|Error|Fatal" tour.log | head -9 | sed 's/^/::error title=Rundgang Windows::/' || true
          tail -9 tour.log | tr -d '\r' | sed 's/^/::warning title=Rundgang Windows (Ende)::/' 
      - uses: actions/download-artifact@v4
        with:
          name: rundgang-linux
          path: ${{ runner.temp }}/rundgang-linux
      - name: Linux ↔ Windows vergleichen
        shell: bash
        run: python tools/compare_tours.py "$RUNNER_TEMP/rundgang-linux" "$RUNNER_TEMP/rundgang-win" "$RUNNER_TEMP/vergleich"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vergleich-linux-windows
          path: ${{ runner.temp }}/vergleich
          retention-days: 7

  build-linux:
    # Ubuntu 22.04 als Basis: das Paket läuft damit auf Kubuntu 22.04, 24.04 und neuer
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketquellen – bei Netzfehlern wiederholen statt hängen
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nDPkg::Lock::Timeout "120";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-alupc-ci
          # Störung 11.11.2026 (actions/runner-images#15297): die Ubuntu-Spiegel ließen sich auf den GitHub-Rechnern
          # nicht auflösen. Dann auf den Spiegel von kernel.org ausweichen.
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if ! getent hosts "$host" >/dev/null; then
              echo "::warning title=Paketquellen::$host nicht erreichbar – weiche auf mirrors.edge.kernel.org aus"
              for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
                [ -f "$f" ] && sudo sed -i -E 's#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' "$f"
              done
              break
            fi
          done
      - name: Systembibliotheken für Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libpulse0 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libfontconfig1 libdbus-1-3 libxkbfile1 \
            libxcb-cursor0
      - name: Installieren
        # Nicht „-e“: PyInstaller findet Pakete aus einer Entwicklungs-Installation nicht
        run: pip install ".[test]" pyinstaller
      - name: Tests (Logik)
        run: pytest -v tests/test_logic.py
      - name: AluPC bauen (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name AluPC
          --paths .
          --collect-submodules alupc
          --collect-submodules serial
          --collect-submodules segno
          --collect-all vosk
          --collect-all piper
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all pyatv
          --collect-submodules pychromecast
          --collect-submodules zeroconf
          --collect-all av
          --collect-data alupc
          packaging/pyinstaller_entry.py
      - name: Fertiges Programm starten (Selbsttest)
        run: |
          QT_QPA_PLATFORM=offscreen dist/AluPC/AluPC --selbsttest "$RUNNER_TEMP/selbsttest.txt" || { cat "$RUNNER_TEMP/selbsttest.txt"; exit 1; }
          cat "$RUNNER_TEMP/selbsttest.txt"
      - name: Version bestimmen
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "v=$(python -c 'import alupc; print(alupc.__version__)')" >> "$GITHUB_OUTPUT"; fi
      - name: .deb-Paket bauen
        run: |
          packaging/linux/build_deb.sh "${{ steps.version.outputs.v }}"
          cp packaging/linux/AluPC-installieren.sh dist/
      - name: .deb installieren und starten (Test)
        run: |
          sudo apt-get install -y "./dist/alupc_${{ steps.version.outputs.v }}_amd64.deb"
          # echtes UxPlay (wie bei Kubuntu): die fertige Version darf ihm nicht ihre eigenen Bibliotheken
          # unterschieben (sonst „symbol lookup error“, Exit-Code 127)
          sudo apt-get install -y uxplay >/dev/null 2>&1 || echo "::warning title=UxPlay-Test::uxplay nicht installierbar"
          QT_QPA_PLATFORM=offscreen alupc --selbsttest "$RUNNER_TEMP/deb.txt" || { cat "$RUNNER_TEMP/deb.txt"; exit 1; }
          cat "$RUNNER_TEMP/deb.txt"
          if command -v uxplay >/dev/null; then
            line=$(grep "UxPlay: " "$RUNNER_TEMP/deb.txt" | head -1)
            echo "::notice title=UxPlay aus der fertigen Version::$line"
            if [ -z "$line" ]; then echo "::warning title=UxPlay-Test::keine UxPlay-Zeile im Selbsttest"
            elif ! echo "$line" | grep -qi "uxplay version\|uxplay 1\."; then
              echo "::error title=UxPlay startet nicht aus AluPC::$line"; exit 1
            fi
            # Bild direkt an AluPC (UxPlay 1.6x ohne -vrtp): baut UxPlay die Pipeline mit AluPCs Teilen?
            # Nur wenn diese UxPlay-Version -vd/-vc/-vs kennt (1.46 aus Ubuntu 22.04 nicht → AluPC nimmt das Fenster)
            if uxplay -h 2>&1 | grep -q "^-vc" && uxplay -h 2>&1 | grep -q "^-vd"; then
              timeout 6 uxplay -d -n AluPC-CI -nh -p -vd identity -vc identity \
                -vs "rtph264pay config-interval=1 pt=96 ! udpsink host=127.0.0.1 port=5600" > "$RUNNER_TEMP/ux.txt" 2>&1 || true
              if grep -q "Initialized GStreamer video renderer" "$RUNNER_TEMP/ux.txt"; then
                echo "::notice title=AirPlay-Bild an AluPC (RTP)::$(grep -A1 'video pipeline will be' "$RUNNER_TEMP/ux.txt" | tail -1)"
              else
                echo "::error title=AirPlay-Bildweg::UxPlay nimmt die RTP-Pipeline nicht an"; cat "$RUNNER_TEMP/ux.txt"; exit 1
              fi
            else
              echo "::notice title=AirPlay-Bildweg::$(uxplay -v 2>&1 | head -1) kennt -vd/-vc nicht – AluPC nutzt dort UxPlays Fenster"
            fi
          fi
      - name: Sprache in der fertigen Version – Piper spricht ins (virtuelle) Mikrofon, installiertes AluPC versteht
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils >/dev/null || { sudo apt-get update; sudo apt-get install -y pulseaudio pulseaudio-utils >/dev/null; }
          pulseaudio -D --exit-idle-time=-1
          sleep 1
          pactl load-module module-null-sink sink_name=virt >/dev/null
          pactl load-module module-virtual-source source_name=virtmic master=virt.monitor >/dev/null
          pactl set-default-source virtmic
          export XDG_CONFIG_HOME="$RUNNER_TEMP/sprachcfg"
          python tests/make_voice_wavs.py "$RUNNER_TEMP/wavs"
          # Erkennung schwankt (Piper spricht jedes Mal etwas anders): 3 von 4 reichen, wie beim Test aus dem Quellcode
          ALUPC_SPRACHTEST_MIN=3 ALUPC_SPRACHTEST_ANZAHL=4 QT_QPA_PLATFORM=offscreen alupc --sprachtest "$RUNNER_TEMP/sprach.txt" &
          pid=$!
          for i in $(seq 1 90); do grep -q "ZUSTAND hört zu" "$RUNNER_TEMP/sprach.txt" 2>/dev/null && break; sleep 1; done
          for w in "$RUNNER_TEMP"/wavs/satz*.wav; do paplay -d virt "$w"; sleep 1; done
          sleep 5; kill -0 $pid 2>/dev/null && kill $pid  # nach den Sätzen nicht ewig warten
          rc=0; wait $pid || rc=$?
          cat "$RUNNER_TEMP/sprach.txt"
          echo "::notice title=Sprache in der fertigen Linux-Version::$(grep -E 'MIKROFONE|GEHÖRT|BEFEHL|NICHT|FEHLER|ENDE' "$RUNNER_TEMP/sprach.txt" | tr '\n' ' ‖ ')"
          n=$(grep -c '^BEFEHL' "$RUNNER_TEMP/sprach.txt" || true)
          if [ "$n" -lt 3 ]; then echo "::error title=Sprache in der fertigen Version::nur $n/4 Befehle verstanden"; exit 1; fi
      - name: Installationsskript – wartet, wenn die Paketverwaltung gesperrt ist („Sperrung nicht möglich“)
        run: |
          cp dist/alupc_*_amd64.deb dist/AluPC-installieren.sh "$RUNNER_TEMP/"
          # anderes Programm hält 15 s die dpkg-Sperre (wie Discover/automatische Updates)
          sudo bash -c 'exec 9>/var/lib/dpkg/lock-frontend; sleep 15' &
          sleep 1
          start=$(date +%s)
          sudo bash "$RUNNER_TEMP/AluPC-installieren.sh" < /dev/null | tee "$RUNNER_TEMP/inst.txt"
          took=$(( $(date +%s) - start ))
          echo "::notice title=Installationsskript::gewartet ${took} s · $(tail -1 "$RUNNER_TEMP/inst.txt")"
          grep -q "AluPC ist installiert" "$RUNNER_TEMP/inst.txt"
          test "$took" -ge 10
      - name: Spiegel-Probe unter X11 (Xvfb, echtes Bildschirmaufnehmen)
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb >/dev/null
          # Fehlen dem Qt-X11-Anschluss Systembibliotheken? (dann startet AluPC unter X11 nicht)
          plugin=$(find /opt/alupc -name libqxcb.so | head -1)
          ldd "$plugin" $(dirname "$plugin")/../../lib/libQt6XcbQpa.so.6 2>/dev/null | grep "not found" | sort -u | sed 's/^/::warning title=Linux-X11-Bibliotheken fehlen::/' || true
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" env QT_QPA_PLATFORM=xcb /opt/alupc/AluPC --selbsttest "$RUNNER_TEMP/x11.txt" > "$RUNNER_TEMP/x11.out" 2>&1
          echo "::notice title=Linux-X11-Diagnose::Exit-Code $?"
          if grep -q '^DIAG' "$RUNNER_TEMP/x11.txt" 2>/dev/null; then
            grep '^DIAG' "$RUNNER_TEMP/x11.txt" | sed 's/^DIAG /::notice title=Linux-X11-Diagnose::/'
          else
            tail -n 15 "$RUNNER_TEMP/x11.txt" "$RUNNER_TEMP/x11.out" 2>/dev/null | tr -d '\r' | sed 's/^/::warning title=Linux-X11-Diagnose::/'
          fi
          test -f /usr/share/applications/alupc.desktop
          grep -q '^Exec=/opt/alupc/AluPC$' /usr/share/applications/alupc.desktop
          grep -q '^X-KDE-DBUS-Restricted-Interfaces=org.kde.KWin.ScreenShot2' /usr/share/applications/alupc.desktop
          test -f /usr/share/icons/hicolor/48x48/apps/alupc.png
          test -f /usr/share/icons/hicolor/scalable/apps/alupc.svg
          # Fingerabdruck: apt muss fprintd + libpam-fprintd (empfohlene Pakete) gleich mitinstallieren
          dpkg -s fprintd libpam-fprintd | grep -E '^(Package|Status)'
          grep -q 'Fingerabdruck-Pakete: vollständig' "$RUNNER_TEMP/deb.txt"
          # Fingerabdruckmodul am USB-Seriell-Adapter: Zugriffsregel da, Anmelde-Prüfung läuft (ohne Modul: Nein)
          test -f /usr/lib/udev/rules.d/70-alupc-serial.rules
          grep -q 'pyserial da' "$RUNNER_TEMP/deb.txt"
          set +e; PAM_USER=nobody timeout 30 /opt/alupc/AluPC --fingerabdruck-pam; code=$?; set -e
          test "$code" -eq 1
      - name: Portables Archiv
        run: tar -C dist -czf "dist/AluPC-linux-x86_64-${{ steps.version.outputs.v }}.tar.gz" AluPC
      - uses: actions/upload-artifact@v4
        with:
          name: AluPC-Linux
          path: |
            dist/alupc_*_amd64.deb
            dist/AluPC-linux-x86_64-*.tar.gz
            dist/AluPC-installieren.sh

  wlan-windows:
    # Eigener Job auf Windows Server 2022: dort liegt das Container-Abbild fürs „Handy“ schon bereit
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installieren
        run: pip install -e . zxing-cpp pillow
      - name: Mobilen Hotspot nachbauen (Windows-Internetfreigabe, Handy = Container)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows/hotspot_sim.ps1 *>&1 | Tee-Object -FilePath sim.log
          if ($LASTEXITCODE -ne 0 -or -not (Get-NetIPAddress -IPAddress 192.168.137.1 -ErrorAction SilentlyContinue)) {
            Get-Content sim.log -Tail 15 | ForEach-Object { Write-Output "::error title=Hotspot nachbauen::$_" }; exit 1 }
      - name: AluPC-WLAN echt – Handy im Hotspot-Netz (Firewall-Freigabe, QR-Codes, Mitspielen, Abstimmen)
        shell: bash
        run: |
          set +e +o pipefail  # sonst endet der Schritt vor der Fehlerausgabe
          python -X faulthandler -u tests/wlan_windows_check.py mcr.microsoft.com/windows/servercore:ltsc2022 2>&1 | tee wlan.log
          test "${PIPESTATUS[0]}" -eq 0 || { grep "FEHL" wlan.log | sed 's/^/::error title=AluPC-WLAN (Windows)::/'
            tail -n 25 wlan.log | tr -d '\r' | sed 's/^/::error title=AluPC-WLAN (Windows, Ende)::/'; exit 1; }
          echo "::notice title=AluPC-WLAN (Windows)::$(grep -E '^  (OK|FEHL)|bestanden' wlan.log | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installieren
        # Nicht „-e“: PyInstaller findet Pakete aus einer Entwicklungs-Installation nicht
        run: pip install ".[test]" pyinstaller py-spy
      - name: Hotspot-Skript (Runner ohne WLAN – PowerShell muss laufen und eine klare Meldung geben)
        shell: pwsh
        run: |
          $out = python -c "from alupc import hotspot as h; c, o = h._ps(h._PS_STATE, timeout=60); print(o.replace(chr(10), ' | ')); print('MELDUNG', h.windows_message(o)[1])"
          Write-Output "::notice title=Hotspot (Windows)::$($out -join ' ')"
          if (($out -join ' ') -match 'ParserError|Unexpected token|MissingEndCurlyBrace') { Write-Output "::error title=Hotspot::PowerShell-Skript kaputt"; exit 1 }
      - name: Mischpult + Treiber-Skripte (Windows) – Core Audio aufrufbar, PowerShell gültig
        shell: pwsh
        run: |
          $out = python -c "from alupc import mixer, mixer_meters, drivers; import json; s = mixer.snapshot(); print('GERAETE', len(s['out']), len(s['in']), 'PROGRAMME', len(s['apps']), 'VIRTUELL', json.dumps(s['virtual'])); m = mixer_meters.Meters(); m.set_channels([{'key': d['id'], 'kind': 'out', 'dev': d['id'], 'stream': None, 'sink': ''} for d in s['out']]); import time; time.sleep(0.5); m.stop(); print('PEGEL ok'); print('KAMERA', drivers.vcam_installed())"
          Write-Output "::notice title=Mischpult (Windows)::$($out -join ' | ')"
          if (-not (($out -join ' ') -match 'PEGEL ok')) { Write-Output "::error title=Mischpult (Windows)::$($out -join ' | ')"; exit 1 }
          $script = python -c "from alupc import drivers; print(drivers.vbcable_ps() + drivers.obs_vcam_ps())"
          $err = $null; [void][System.Management.Automation.Language.Parser]::ParseInput(($script -join "`n"), [ref]$null, [ref]$err)
          if ($err.Count) { $err | ForEach-Object { Write-Output "::error title=Treiber-Skript::$($_.Message)" }; exit 1 }
      - name: Jede Einstellung echt bedienen (Windows) – gespeichert, zurückstellbar, wirkt
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python tests/settings_check.py > settings.log 2>&1 || {
            grep -E "✗|Traceback|Error" settings.log | head -30 | sed 's/^/::error title=Einstellungen (Windows)::/'
            tail -n 25 settings.log | tr -d '\r' | sed 's/^/::error title=Einstellungen (Windows, Ende)::/'; exit 1; }
          echo "::notice title=Einstellungen (Windows)::$(tail -1 settings.log)"
      - name: Ins System eingebunden (Rechtsklick + alupc://-Links echt)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/integration_windows_check.py
      - name: AluPC-Farben für den Desktop echt (Registry setzen und zurückstellen)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/desktop_theme_windows_check.py
      - name: Tests (Logik + Windows-Strukturen)
        shell: pwsh
        run: |
          python -X faulthandler -m pytest -v -rf tests/test_logic.py tests/test_system_integration.py 2>&1 | Tee-Object -FilePath logic.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path logic.log -Pattern '^(FAILED|E   |ERROR)' | Select-Object -First 40 |
              ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            # Absturz (z. B. Zugriffsverletzung) hat keine FAILED-Zeilen – dann zeigt das Ende des Protokolls den Grund
            Get-Content logic.log -Tail 20 | ForEach-Object { Write-Output ("::error::" + $_.Trim()) }
            exit 1
          }
      - name: Tests (Oberfläche)
        shell: pwsh
        timeout-minutes: 45
        run: |
          $env:ALUPC_TEST_HANG_EXIT = "300"  # hängt ein Test 5 Minuten: Stapel in gui-haenger.txt, Abbruch
          python -X faulthandler -m pytest -v -rf tests/test_gui.py 2>&1 | Tee-Object -FilePath gui.log
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Select-String -Path gui-haenger.txt -Pattern 'Thread' -Quiet -ErrorAction SilentlyContinue)) {
            Get-Content gui-haenger.txt | Where-Object { $_.Trim() } | Select-Object -First 60 |
              ForEach-Object { Write-Output ("::error title=Test hängt::" + $_.Trim()) }
            exit 1
          }
          if ($code -ne 0 -and (Select-String -Path gui.log -Pattern 'Fatal Python error' -Quiet)) {
            # Absturz von Qt beim Auf-/Abbau zwischen zwei Tests: vollständig melden (Ursache finden) …
            $lines = Get-Content gui.log
            $i = ($lines | Select-String -Pattern 'Fatal Python error' | Select-Object -First 1).LineNumber
            $lines[[Math]::Max(0, $i - 30)..[Math]::Min($lines.Count - 1, $i + 40)] | Where-Object { $_.Trim() } |
              ForEach-Object { Write-Output ("::warning title=Absturz (Oberflächentests)::" + $_.Trim()) }
            # … und mit den übrigen Tests weitermachen (ab dem abgestürzten) – bis zu 3-mal, die bestandenen
            # aus allen Läufen werden übersprungen. Ein echter Fehler (FAILED) bleibt rot.
            Copy-Item gui.log gui-all.log
            # Weiter, solange jeder Neustart neue Tests schafft; stürzt derselbe Test ohne Fortschritt erneut ab → rot.
            $before = -1
            for ($try = 1; $try -le 40 -and $code -ne 0 -and (Select-String -Path gui.log -Pattern 'Fatal Python error' -Quiet) -and
                 -not (Select-String -Path gui.log -Pattern '^FAILED ' -Quiet); $try++) {
              $done = @(Select-String -Path gui-all.log -Pattern '^(tests/test_gui\.py::\S+) PASSED' |
                ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique)
              if ($done.Count -le $before) {
                Write-Output "::error title=Oberflächentests::Absturz ohne Fortschritt – derselbe Test stürzt immer wieder ab"
                break
              }
              $before = $done.Count
              Write-Output ("::notice title=Oberflächentests::Absturz – Neustart $try, " + $done.Count + " Tests schon bestanden")
              $args2 = @(); foreach ($t in $done) { $args2 += "--deselect"; $args2 += $t }
              python -X faulthandler -m pytest -v -rf tests/test_gui.py @args2 2>&1 | Tee-Object -FilePath gui.log
              $code = $LASTEXITCODE
              Get-Content gui.log | Add-Content gui-all.log
            }
          }
          if ($code -ne 0) {
            # Fehler als Hinweis (Annotation) ausgeben – die sind auch ohne Anmeldung sichtbar
            # Bei einem Absturz: welcher Test lief gerade? (letzte Testzeile vor „Fatal …“)
            $last = Select-String -Path gui.log -Pattern '^tests/test_gui\.py::' | Select-Object -Last 1
            if ($last) { Write-Output ("::error title=Zuletzt gelaufener Test::" + $last.Line.Trim()) }
            Select-String -Path gui.log -Pattern '^(FAILED|E   |ERROR|Fatal|Windows fatal|  File "D:)' |
              Select-Object -First 40 | ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            Get-Content gui.log -Tail 60 | Where-Object { $_.Trim() -and $_ -notmatch 'site-packages' } |
              Select-Object -Last 25 | ForEach-Object { Write-Output ("::warning::" + $_.Trim()) }
            exit 1
          }
      - name: Oberflächentests – letzte Zeilen (nur bei Fehler)
        if: failure()
        shell: pwsh
        run: |
          # GitHub zeigt nur ~10 Meldungen je Schritt → alles Wichtige in EINE Meldung (Zeilen mit %0A getrennt)
          $lines = @()
          if (Test-Path gui-haenger.txt) { $lines += Get-Content gui-haenger.txt | Where-Object { $_ -match 'Test hängt|alupc|tests\\|Thread' } | Select-Object -First 60 }
          if (Test-Path gui-haenger-nativ.txt) { $lines += '--- nativ (cdb) ---'; $lines += Get-Content gui-haenger-nativ.txt | Where-Object { $_ -match '!|Id:|läuft|cdb|Thread' } | Select-Object -First 200 }
          if (Test-Path gui.log) {
            $log = Get-Content gui.log
            $lines += $log | Where-Object { $_ -match '^tests/test_gui\.py::' } | Select-Object -Last 3
            $lines += $log | Where-Object { $_ -match 'Timeout|Thread 0x|Current thread|alupc\\|tests\\' } | Select-Object -Last 60
          }
          if ($lines.Count) { Write-Output ("::warning title=Hänger (Oberflächentests)::" + (($lines | ForEach-Object { $_.Trim() }) -join '%0A')) }
      - name: Sprache echt – Piper spricht, Vosk/Whisper hören, AluPC versteht
        run: python tests/voice_real_check.py
      - name: AluPC.exe bauen (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name AluPC
          --icon packaging/windows/alupc.ico
          --paths .
          --collect-submodules alupc
          --collect-submodules serial
          --collect-submodules segno
          --collect-all vosk
          --collect-all piper
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all pyatv
          --collect-submodules pychromecast
          --collect-submodules zeroconf
          --collect-all av
          --collect-all winrt
          --collect-submodules comtypes
          --collect-data alupc
          packaging/pyinstaller_entry.py
      - name: Anmeldebaustein für das Fingerabdruckmodul bauen (C++, MSVC)
        shell: pwsh
        run: |
          cmake -S packaging/windows/credprov -B build/credprov -A x64
          cmake --build build/credprov --config Release
          New-Item -ItemType Directory -Force dist\AluPC\credprov | Out-Null
          Copy-Item build\credprov\Release\AluPCFingerprint.dll dist\AluPC\credprov\
          Get-Item dist\AluPC\credprov\AluPCFingerprint.dll | ForEach-Object { Write-Output "::notice title=Anmeldebaustein::$($_.Name) $([math]::Round($_.Length/1KB)) KB" }
      - name: Anmeldebaustein testen (LogonUI nachgespielt, Modul nachgebaut, Passwort per DPAPI)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $pipe = "\\.\pipe\alupc-fp-ci"
          $cfg = Join-Path $env:RUNNER_TEMP "fp.cfg"
          # Einstellung genau so schreiben, wie AluPC es tut (Python, DPAPI Maschine)
          python -c "import sys; sys.path.insert(0,'.'); from alupc.platform import windows_serial_login as w; open(sys.argv[1],'w',encoding='utf-8').write(w.format_config({'port': sys.argv[2], 'baud': 57600, 'capacity': 50, 'users': {'ci-tester': {'domain': '.', 'slots': [3], 'secret': w.protect('Tüt-Geheim 42!')}}}))" $cfg $pipe
          # Plätze-Datei (neue Finger/Personen ohne Adminrechte): Platz 7 steht nur dort → muss trotzdem gelten
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "fingerprint-ci-tester.slots") -Value @("3,7", "7=Lena") -Encoding ascii
          $fake = Start-Process python -ArgumentList "tests\fake_zw101_pipe.py", $pipe, "7" -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\fake.txt"
          Start-Sleep -Seconds 2
          $out = & build\credprov\Release\cptest.exe $cfg 20
          $out | ForEach-Object { Write-Output $_ }
          $fake | Wait-Process -Timeout 10 -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\fake.txt" -ErrorAction SilentlyContinue
          $text = $out -join "`n"
          if ($text -notmatch "CPTEST-OK" -or $text -notmatch "USER=ci-tester" -or $text -notmatch "PASS=Tüt-Geheim 42!" -or $text -notmatch "MSG=Hallo Lena – melde an …") {
            Write-Output "::error title=Anmeldebaustein::$($text -replace "`n", ' | ')"; exit 1
          }
          # Begrüßung: erkannter Platz steht in der Registry (Test: HKCU statt HKLM)
          $last = (Get-ItemProperty -Path "HKCU:\SOFTWARE\AluPC\Fingerprint" -Name "ci-tester" -ErrorAction SilentlyContinue)."ci-tester"
          if ($last -notmatch '^7;\d{9,}$') { Write-Output "::error title=Begrüßung::Platz nicht gemerkt: '$last'"; exit 1 }
          Write-Output "::notice title=Anmeldebaustein::Finger erkannt → Anmeldung für ci-tester gebaut, Passwort aus DPAPI korrekt · Begrüßung merkt Platz $last"
          # Einrichten wie AluPC (Admin): Datei schützen, bei Windows anmelden, wieder abmelden
          python -c "import sys; sys.path.insert(0,'.'); from pathlib import Path; from alupc.platform import windows_serial_login as w; p=Path(sys.argv[1]); w.apply_request({'action':'an','user':'ci-tester','domain':'.','slots':[7],'port':'COM9','baud':57600,'capacity':50,'secret':w.protect('x'),'sid':w.current_sid()}, path=p, dll=Path(sys.argv[2])); assert w.registered(), 'nicht registriert'; assert w._default_provider() == w.CLSID, 'nicht vorausgewählt';sp=w.slots_path('ci-tester', p.parent); assert sp.is_file(), 'keine Plätze-Datei'; sp.write_text(w.format_slots([7, 12])); print('SLOTS', sp.read_text().strip(), __import__('subprocess').run(['icacls', str(sp)], capture_output=True, text=True).stdout.replace(chr(10),' ')); print('ACL', __import__('subprocess').run(['icacls', str(p)], capture_output=True, text=True).stdout.replace(chr(10),' ')); w.apply_request({'action':'aus','user':'ci-tester','slots':[]}, path=p); assert not w.registered() and not p.exists() and not sp.exists() and not w._default_provider(), 'nicht abgemeldet'; print('REG-OK')" "$env:RUNNER_TEMP\fp-reg.cfg" "$PWD\dist\AluPC\credprov\AluPCFingerprint.dll"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Anmeldebaustein::Registrieren/Abmelden fehlgeschlagen"; exit 1 }
      - name: Fertige AluPC.exe starten (Selbsttest)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "selbsttest.txt"
          $p = Start-Process -FilePath dist\AluPC\AluPC.exe -ArgumentList "--selbsttest", $log -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          # Diagnose (u. a. echte Probe-Aufnahme fürs Spiegeln) als Hinweise im Lauf sichtbar machen
          if (Test-Path $log) { Get-Content $log | Where-Object { $_ -like "DIAG *" } | ForEach-Object { Write-Output "::notice title=Windows-Diagnose::$($_.Substring(5))" } }
          if ($p.ExitCode -ne 0) {
            Get-Content "$log.haenger.txt" -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "::error title=Selbsttest-Stapel::$_" }
            if (Test-Path $log) { Get-Content $log -Tail 25 | Where-Object { $_ -notlike "DIAG *" } | ForEach-Object { Write-Output "::error title=Selbsttest::$_" } }
            throw "AluPC.exe Selbsttest fehlgeschlagen (Exit-Code $($p.ExitCode))" }
      - name: AirPlay echt – uxplay-windows über winget installieren und von AluPC starten lassen
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 10
        run: |
          foreach ($id in "Apple.Bonjour", "leapbtw.uxplay") {
            $out = winget install --id $id -e --silent --accept-source-agreements --accept-package-agreements 2>&1 | Select-Object -Last 2
            Write-Output "::notice title=AirPlay-Probe::winget $id -> $($out -join ' | ')"
          }
          Get-Process | Where-Object { $_.Name -match "uxplay" } | ForEach-Object { Write-Output "::notice title=AirPlay-Probe::läuft schon nach Installation: $($_.Name)" }
          $n = @(Get-Process explorer -ErrorAction SilentlyContinue).Count
          Write-Output "::notice title=AirPlay-Probe::Explorer (Taskleiste/Tray) läuft: $n Prozess(e)"
          # pythonw: ohne eigene Konsole – sonst schreibt uxplay-windows (AttachConsole) an AluPC vorbei
          $out = Join-Path $env:RUNNER_TEMP "airplay-probe.txt"
          $p = Start-Process -FilePath (Join-Path (Split-Path (Get-Command python).Source) "pythonw.exe") -ArgumentList ".github/scripts/airplay_probe.py" -RedirectStandardOutput $out -RedirectStandardError "$out.err" -Wait -PassThru -NoNewWindow
          Get-Content $out -ErrorAction SilentlyContinue
          Write-Output "::notice title=AirPlay-Probe-Ende::Exit $($p.ExitCode) · $((Get-Content "$out.err" -ErrorAction SilentlyContinue | Select-Object -Last 6) -join ' | ')"
      - name: Firewall-Freigabe für AirPlay (alle Netzwerktypen, Sperr-Regeln für UxPlay ersetzen)
        shell: pwsh
        continue-on-error: true
        run: python .github/scripts/firewall_probe.py
      - name: Fenster-Probe – iPhone-Fenster randlos im Vordergrund platzieren (echter Desktop)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:QT_QPA_PLATFORM = "windows"
          python .github/scripts/present_probe.py
      - name: Spiegel-Probe auf dem echten Windows-Desktop
        shell: pwsh
        continue-on-error: true
        run: |
          $log = Join-Path $env:RUNNER_TEMP "desktop.txt"
          $env:QT_QPA_PLATFORM = "windows"
          $p = Start-Process -FilePath dist\AluPC\AluPC.exe -ArgumentList "--selbsttest", $log -Wait -PassThru
          Write-Output "::notice title=Windows-Desktop-Diagnose::Exit-Code $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log | Where-Object { $_ -like "DIAG *" -and ($_ -like "*Aufnahme*" -or $_ -like "*bei 0*" -or $_ -like "*Monitor*" -or $_ -like "*Spiegel*" -or $_ -like "*Schrift*") } | ForEach-Object { Write-Output "::notice title=Windows-Desktop-Diagnose::$($_.Substring(5))" } }
          # Treiber für Fingerabdruckmodule am seriellen Anschluss (HLK-ZW101) muss in der .exe stecken
          if (-not (Select-String -Path $log -Pattern "pyserial da" -Quiet)) { throw "pyserial fehlt in AluPC.exe" }
      - name: Version bestimmen
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "v=$(python -c 'import alupc; print(alupc.__version__)')" >> "$GITHUB_OUTPUT"; fi
      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.v }}" packaging\windows\alupc.iss
      - name: Installer still installieren und starten (Test)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\AluPC-Setup-*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/MERGETASKS=!handy", "/DIR=$env:RUNNER_TEMP\AluPC-inst", "/LOG=$env:RUNNER_TEMP\setup.log" -PassThru
          if (-not $p.WaitForExit(600000)) {
            # GitHub zeigt nur ~10 Meldungen je Schritt – deshalb alles in EINER Meldung (Zeilen mit %0A)
            $tail = (Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 25 -ErrorAction SilentlyContinue) -join "%0A"
            Write-Output "::error title=Installer hängt – Protokollende::$tail"
            $procs = (Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -ne $PID -and ($_.Name -match 'AluPC|winget|netsh|powershell|setup|tmp|msiexec|VBCABLE|OBS|cmd') } |
              ForEach-Object { "$($_.ProcessId) <- $($_.ParentProcessId) $($_.Name): $($_.CommandLine)" }) -join "%0A"
            Write-Output "::error title=Installer hängt – laufende Prozesse::$procs"
            throw "Installer hängt (10 Minuten)" }
          if ($p.ExitCode -ne 0) { throw "Installer fehlgeschlagen (Exit-Code $($p.ExitCode))" }
          $log = Join-Path $env:RUNNER_TEMP "inst.txt"
          $q = Start-Process -FilePath "$env:RUNNER_TEMP\AluPC-inst\AluPC.exe" -ArgumentList "--selbsttest", $log -PassThru
          if (-not $q.WaitForExit(600000)) {
            Get-Content $log -Tail 15 -ErrorAction SilentlyContinue | Where-Object { $_ -notlike "DIAG *" } | ForEach-Object { Write-Output "::error title=Selbsttest hängt – zuletzt::$_" }
            Get-Content "$log.haenger.txt" -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "::error title=Selbsttest-Stapel::$_" }
            Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $q.Id } | ForEach-Object { Write-Output "::error title=Kindprozess::$($_.Name) $($_.CommandLine)" }
            $q.Kill(); throw "Installiertes AluPC hängt im Selbsttest (10 Minuten)" }
          if (Test-Path $log) { Get-Content $log }
          if ($q.ExitCode -ne 0) {
            Get-Content "$log.haenger.txt" -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "::error title=Selbsttest-Stapel::$_" }
            throw "Installiertes AluPC startet nicht (Exit-Code $($q.ExitCode))" }
      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\AluPC\* -DestinationPath dist\AluPC-windows-portable-${{ steps.version.outputs.v }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AluPC-Windows
          path: |
            dist/AluPC-Setup-*.exe
            dist/AluPC-windows-portable-*.zip

  release:
    # Release bei einem Tag „v…“ oder bei einem Commit auf main mit „[release]“ in der Nachricht
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: [test-linux, build-linux, build-windows, wlan-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version bestimmen
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT";
          else echo "tag=v$(python3 -c 'import alupc; print(alupc.__version__)')" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: AluPC-*  # nur die Programm-Dateien (nicht Rundgang-/Vergleichsbilder)
          merge-multiple: true
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AluPC ${{ steps.version.outputs.tag }}
          body_path: packaging/RELEASE_NOTES.md
          files: release/*
      - name: Release-Seiten aufräumen (nur Programm-Dateien – keine Rundgang-Bilder)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 5 --json tagName --jq '.[].tagName'); do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              { grep -Ev '^(AluPC-|alupc_)' || true; } | while read -r name; do
                gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" --yes && echo "$tag: $name entfernt"
              done
          done
